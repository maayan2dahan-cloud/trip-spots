<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>טיולים וטבע בארץ</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a href="/" class="logo">🌿 טיולים <span>וטבע</span> בארץ</a>
    <a href="/add" class="btn">+ הוספת מקום</a>
  </header>

  <div class="filters">
    <div class="chip-row" id="type-filters"></div>
    <div class="chip-row" id="visited-filters"></div>
    <div class="chip-row">
      <button class="chip area-btn" id="area-btn">📍 מה יש באזור?</button>
    </div>
    <div class="counter" id="counter"></div>
  </div>

  <!-- חלון "מה יש באזור" -->
  <div class="area-panel" id="area-panel" hidden>
    <div class="area-head">
      <strong>מה יש באזור?</strong>
      <button class="icon-btn" id="area-close">✕</button>
    </div>
    <div class="area-controls">
      <span>רדיוס:</span>
      <select id="area-radius">
        <option value="5">5 ק"מ</option>
        <option value="10">10 ק"מ</option>
        <option value="20" selected>20 ק"מ</option>
        <option value="50">50 ק"מ</option>
      </select>
      <button class="chip" id="my-location">📡 המיקום שלי</button>
    </div>
    <div class="area-hint" id="area-hint">לחצי על המפה בנקודה שמעניינת אותך</div>
    <ul class="area-list" id="area-list"></ul>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // המקומות מגיעים מפייתון
    const places = {{ places | tojson }};

    const EMOJI = { "מעיין": "💧", "תצפית": "🌄", "מסלול": "🥾", "נחל": "🏞️", "אחר": "📍" };

    const TYPE_OPTIONS = [
      ["הכול", "הכול"], ["מעיין", "💧 מעיינות"], ["תצפית", "🌄 תצפיות"],
      ["מסלול", "🥾 מסלולים"], ["נחל", "🏞️ נחלים"], ["אחר", "📍 אחר"]
    ];
    const VISITED_OPTIONS = [
      ["הכול", "הכול"], ["ביקרתי", "✅ ביקרתי"], ["אינסטגרם", "📱 עוד לא"]
    ];

    // ---------- מצב הסינון ----------
    let typeFilter = "הכול";
    let visitedFilter = "הכול";

    // ---------- מצב "מה יש באזור" ----------
    let areaOpen = false;     // האם החלון פתוח
    let areaCenter = null;    // הנקודה שנבחרה [lat, lng]
    let areaRadius = 20;      // רדיוס בק"מ
    let areaCircle = null;    // העיגול על המפה

    // ---------- המפה ----------
    const map = L.map("map", { zoomControl: false }).setView([31.5, 35.0], 8);
    L.control.zoom({ position: "bottomleft" }).addTo(map);
    L.tileLayer("https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.png", {
      attribution: "© Stadia Maps © OpenMapTiles © OpenStreetMap",
      maxZoom: 20
    }).addTo(map);

    const markersLayer = L.layerGroup().addTo(map);

    // ---------- חישוב מרחק בין שתי נקודות (נוסחת Haversine) ----------
    function distanceKm(lat1, lng1, lat2, lng2) {
      const R = 6371;                          // רדיוס כדור הארץ בק"מ
      const toRad = deg => deg * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    // ---------- חלון המידע ----------
    function popupHtml(p) {
      const waze  = `https://waze.com/ul?ll=${p.lat},${p.lng}&navigate=yes`;
      const gmaps = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;
      const visited = p.visited === "ביקרתי";

      let meta = `<span class="meta">${visited ? "✅ ביקרתי" : "📱 מהאינסטגרם"}</span>`;
      if (p.parking) meta += `<span class="meta">🚗 חניה: ${p.parking}</span>`;
      if (p.crowded) meta += `<span class="meta">👥 ${p.crowded}</span>`;
      if (p.walk_minutes !== null) {
        meta += `<span class="meta">🥾 ${p.walk_minutes === 0 ? "ליד החניה" : p.walk_minutes + " דק' הליכה"}</span>`;
      }

      return `
        ${p.image ? `<img class="popup-img" src="/static/uploads/${p.image}">` : ""}
        <div class="popup-body">
          <span class="popup-tag">${EMOJI[p.type] || "📍"} ${p.type || "אחר"}</span>
          <h3>${p.name}</h3>
          ${p.description ? `<p class="popup-desc">${p.description}</p>` : ""}
          <div class="popup-meta">${meta}</div>
          <div class="popup-actions">
            <a class="primary" href="${waze}" target="_blank">Waze</a>
            <a href="${gmaps}" target="_blank">Google Maps</a>
            ${p.instagram ? `<a href="${p.instagram}" target="_blank">Instagram</a>` : ""}
            <a href="/edit/${p.id}">✏️ עריכה</a>
          </div>
        </div>`;
    }

    // ---------- סיכה ----------
    function markerIcon(p) {
      const visited = p.visited === "ביקרתי";
      return L.divIcon({
        className: "marker-wrap",
        html: `<div class="marker ${visited ? "" : "not-visited"}">${EMOJI[p.type] || "📍"}</div>`,
        iconSize: [38, 38],
        iconAnchor: [19, 19],
        popupAnchor: [0, -18]
      });
    }

    // ---------- ציור הסיכות לפי כל הסינונים ----------
    function render() {
      markersLayer.clearLayers();

      // סינון לפי סוג ולפי ביקור
      let shown = places.filter(p =>
        (typeFilter === "הכול" || p.type === typeFilter) &&
        (visitedFilter === "הכול" || (visitedFilter === "ביקרתי") === (p.visited === "ביקרתי"))
      );

      // סינון לפי אזור: מוסיפים מרחק, משאירים רק מה שבתוך הרדיוס, וממיינים
      if (areaCenter) {
        shown = shown
          .map(p => ({ ...p, dist: distanceKm(areaCenter[0], areaCenter[1], p.lat, p.lng) }))
          .filter(p => p.dist <= areaRadius)
          .sort((a, b) => a.dist - b.dist);
      }

      const markerById = {};
      shown.forEach(p => {
        markerById[p.id] = L.marker([p.lat, p.lng], { icon: markerIcon(p) })
          .bindPopup(popupHtml(p), { minWidth: 270, maxWidth: 270 })
          .addTo(markersLayer);
      });

      document.getElementById("counter").textContent = `${shown.length} מקומות`;
      renderAreaList(shown, markerById);
    }

    // ---------- הרשימה בחלון "מה יש באזור" ----------
    function renderAreaList(shown, markerById) {
      const list = document.getElementById("area-list");
      const hint = document.getElementById("area-hint");
      list.innerHTML = "";
      if (!areaCenter) return;

      hint.textContent = shown.length
        ? `${shown.length} מקומות ברדיוס ${areaRadius} ק"מ`
        : `אין מקומות ברדיוס ${areaRadius} ק"מ. נסי רדיוס גדול יותר`;

      shown.forEach(p => {
        const li = document.createElement("li");
        li.innerHTML = `<span>${EMOJI[p.type] || "📍"} ${p.name}</span>
                        <span class="dist">${p.dist.toFixed(1)} ק"מ</span>`;
        li.addEventListener("click", () => {
          map.setView([p.lat, p.lng], 13);
          markerById[p.id].openPopup();
        });
        list.appendChild(li);
      });
    }

    // ---------- בחירת נקודה ----------
    function setAreaCenter(lat, lng) {
      areaCenter = [lat, lng];
      if (areaCircle) map.removeLayer(areaCircle);
      areaCircle = L.circle(areaCenter, {
        radius: areaRadius * 1000,      // Leaflet מודד במטרים
        color: "#2f6b4f", weight: 1.5, fillOpacity: 0.08
      }).addTo(map);
      map.fitBounds(areaCircle.getBounds());
      render();
    }

    function openArea() {
      areaOpen = true;
      document.getElementById("area-panel").hidden = false;
      document.getElementById("area-hint").textContent = "לחצי על המפה בנקודה שמעניינת אותך";
      map.getContainer().classList.add("picking");
    }

    function closeArea() {
      areaOpen = false;
      areaCenter = null;
      if (areaCircle) { map.removeLayer(areaCircle); areaCircle = null; }
      document.getElementById("area-panel").hidden = true;
      map.getContainer().classList.remove("picking");
      render();
    }

    document.getElementById("area-btn").addEventListener("click", openArea);
    document.getElementById("area-close").addEventListener("click", closeArea);

    // לחיצה על המפה כשהחלון פתוח = בחירת נקודה
    map.on("click", e => {
      if (areaOpen) setAreaCenter(e.latlng.lat, e.latlng.lng);
    });

    // שינוי רדיוס
    document.getElementById("area-radius").addEventListener("change", e => {
      areaRadius = Number(e.target.value);
      if (areaCenter) setAreaCenter(areaCenter[0], areaCenter[1]);
    });

    // המיקום שלי (GPS)
    document.getElementById("my-location").addEventListener("click", () => {
      const hint = document.getElementById("area-hint");
      hint.textContent = "מאתרת את המיקום שלך...";
      navigator.geolocation.getCurrentPosition(
        pos => setAreaCenter(pos.coords.latitude, pos.coords.longitude),
        ()  => hint.textContent = "לא הצלחתי לקבל מיקום. אפשר ללחוץ על המפה במקום."
      );
    });

    // ---------- כפתורי הסינון ----------
    function makeChips(containerId, options, onSelect) {
      const container = document.getElementById(containerId);
      options.forEach(([value, label], i) => {
        const chip = document.createElement("button");
        chip.className = i === 0 ? "chip active" : "chip";
        chip.textContent = label;
        chip.addEventListener("click", () => {
          container.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
          chip.classList.add("active");
          onSelect(value);
          render();
        });
        container.appendChild(chip);
      });
    }

    makeChips("type-filters", TYPE_OPTIONS, value => typeFilter = value);
    makeChips("visited-filters", VISITED_OPTIONS, value => visitedFilter = value);
    render();
  </script>
</body>
</html>
