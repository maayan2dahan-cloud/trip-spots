<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAAYAN'S MAP</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <nav class="top-right">
      <a class="top-link on map-link" href="/">מפה</a>
      <button class="top-link" id="area-btn">מה יש באזור</button>
    </nav>
    <a class="logo" href="/">MAAYAN'S MAP<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 29C10.5 21.5 15.5 13.5 25.5 4.5"/><path d="M10.4 21.2Q8.3 17.0 3.6 17.2Q5.7 21.4 10.4 21.2Z"/><path d="M10.4 21.2Q12.9 24.2 16.6 23.2Q14.1 20.2 10.4 21.2Z"/><path d="M14.8 14.6Q13.5 9.8 8.6 9.0Q9.9 13.8 14.8 14.6Z"/><path d="M14.8 14.6Q17.5 17.9 21.6 16.8Q18.9 13.5 14.8 14.6Z"/><path d="M20.2 8.6Q20.3 4.4 16.6 2.6Q16.5 6.8 20.2 8.6Z"/><path d="M20.2 8.6Q23.1 11.8 27.2 10.6Q24.3 7.4 20.2 8.6Z"/><path d="M24.4 5.6Q27.6 5.1 28.6 2.0Q25.4 2.5 24.4 5.6Z"/></svg></a>
    <nav class="top-left">
      <a class="top-link" href="/add">+<span class="long"> הוספת מקום</span></a>
    </nav>
  </header>

  <div class="filters">
    <div class="f-row" id="type-filters"></div>
    <div class="f-row" id="visited-filters"></div>
    <div class="f-meta" id="counter"></div>
  </div>

  <!-- חלון "מה יש באזור" -->
  <div class="area-panel" id="area-panel" hidden>
    <div class="area-head">
      <strong>מה יש באזור</strong>
      <button class="icon-btn" id="area-close">✕</button>
    </div>
    <div class="area-controls">
      <span>רדיוס</span>
      <select id="area-radius">
        <option value="5">5 ק"מ</option>
        <option value="10">10 ק"מ</option>
        <option value="20" selected>20 ק"מ</option>
        <option value="50">50 ק"מ</option>
      </select>
      <button class="top-link" id="my-location">המיקום שלי</button>
    </div>
    <div class="area-hint" id="area-hint">לחצי על המפה בנקודה שמעניינת אותך</div>
    <ul class="area-list" id="area-list"></ul>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // המקומות מגיעים מפייתון
    const places = {{ places | tojson }};

    // ---------- אייקונים בקו דק לכל סוג ----------
    const ICON = {
      "מעיין": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3c3.5 4.5 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 2.5-6.5 6-11z"/></svg>',
      "תצפית": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 7V4M5.6 10.6 3.8 8.8M18.4 10.6l1.8-1.8"/></svg>',
      "מסלול": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 20l6-10 4 6 3-4 5 8z"/></svg>',
      "נחל":   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9c3-2 5 2 9 0s6-2 9 0M3 15c3-2 5 2 9 0s6-2 9 0"/></svg>',
      "אחר":   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.2"/></svg>'
    };
    // מחלקת צבע לכל סוג (מוגדרת ב-style.css)
    const TYPE_CLASS = { "מעיין": "t-spring", "תצפית": "t-view", "מסלול": "t-trail", "נחל": "t-stream", "אחר": "t-other" };

    const typeOf  = p => ICON[p.type] ? p.type : "אחר";
    const iconOf  = p => ICON[typeOf(p)];
    const classOf = p => TYPE_CLASS[typeOf(p)];

    const TYPE_OPTIONS = [
      ["הכול", "הכול"], ["מעיין", "מעיינות"], ["תצפית", "תצפיות"],
      ["מסלול", "מסלולים"], ["נחל", "נחלים"], ["אחר", "אחר"]
    ];
    const VISITED_OPTIONS = [
      ["הכול", "הכול"], ["ביקרתי", "ביקרתי"], ["אינסטגרם", "עוד לא"]
    ];

    // ---------- מצב הסינון ----------
    let typeFilter = "הכול";
    let visitedFilter = "הכול";

    // ---------- מצב "מה יש באזור" ----------
    let areaOpen = false;     // האם החלון פתוח
    let areaCenter = null;    // הנקודה שנבחרה [lat, lng]
    let areaRadius = 20;      // רדיוס בק"מ
    let areaCircle = null;    // העיגול על המפה

    // ---------- המפה ----------
    const map = L.map("map", { zoomControl: false, zoomSnap: 0, scrollWheelZoom: false }).setView([31.5, 35.0], 8);
    L.control.zoom({ position: "bottomleft" }).addTo(map);

    // ---------- גלגלת ולוח מגע ----------
    // עכבר: גלגלת = זום, גרירה עם לחיצה = הזזה (כמו במפות רגילות)
    // לוח מגע: שתי אצבעות = הזזה, צביטה = זום
    let lastTouchpad = 0;   // מתי בפעם האחרונה זיהינו תנועה של לוח מגע

    function looksLikeTouchpad(e) {
      // לוח מגע שולח הרבה תנועות קטנות, לפעמים גם הצידה ובמספרים לא שלמים.
      // גלגלת של עכבר שולחת "קפיצות" גדולות ועגולות (בערך 100) ורק למעלה/למטה.
      return e.deltaX !== 0 || Math.abs(e.deltaY) < 50 || !Number.isInteger(e.deltaY);
    }

    map.getContainer().addEventListener("wheel", e => {
      e.preventDefault();                       // לא לתת לדפדפן לגלול את כל הדף
      const point = map.mouseEventToContainerPoint(e);

      if (e.ctrlKey) {
        // צביטה בלוח המגע מגיעה לדפדפן כ"גלגלת + Ctrl"
        map.setZoomAround(point, map.getZoom() - e.deltaY * 0.01, { animate: false });
        return;
      }

      const now = Date.now();
      if (looksLikeTouchpad(e)) lastTouchpad = now;

      if (now - lastTouchpad < 400) {
        // באמצע תנועה של לוח מגע: מזיזים את המפה
        map.panBy([e.deltaX, e.deltaY], { animate: false });
      } else {
        // גלגלת של עכבר: זום פנימה או החוצה, סביב המקום של העכבר
        map.setZoomAround(point, map.getZoom() - Math.sign(e.deltaY));
      }
    }, { passive: false });

    // ---------- מפה רחוקה = סיכות קטנות ----------
    const FAR_ZOOM = 10;   // מתחת לזום הזה הסיכות קטנות ובלי תגית
    function updatePinSize() {
      map.getContainer().classList.toggle("far", map.getZoom() < FAR_ZOOM);
    }
    map.on("zoomend", updatePinSize);
    updatePinSize();

    L.tileLayer("https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.png", {
      attribution: "© Stadia Maps © OpenMapTiles © OpenStreetMap",
      maxZoom: 20
    }).addTo(map);

    const markersLayer = L.layerGroup().addTo(map);

    // ---------- חישוב מרחק בין שתי נקודות (נוסחת Haversine) ----------
    function distanceKm(lat1, lng1, lat2, lng2) {
      const R = 6371;                          // רדיוס כדור הארץ בק"מ
      const toRad = deg => deg * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    // ---------- חלון המידע ----------
    function popupHtml(p) {
      const waze  = `https://waze.com/ul?ll=${p.lat},${p.lng}&navigate=yes`;
      const gmaps = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;
      const visited = p.visited === "ביקרתי";

      const meta = [
        visited ? "ביקרתי" : "עוד לא ביקרתי",
        p.parking ? `חניה: ${p.parking}` : "",
        p.crowded ? `עומס: ${p.crowded}` : "",
        p.walk_minutes === 0 ? "ליד החניה" : (p.walk_minutes ? `${p.walk_minutes} דק' הליכה` : "")
      ].filter(Boolean).join("  ·  ");

      return `
        ${p.image ? `<img class="p-img" src="/static/uploads/${p.image}">` : ""}
        <div class="p-body">
          <span class="p-type ${classOf(p)}">${iconOf(p)}${typeOf(p)}</span>
          <h3>${p.name}</h3>
          ${p.description ? `<p class="p-desc">${p.description}</p>` : ""}
          <div class="p-meta">${meta}</div>
          ${(p.directions || p.media_count) ? `<a class="p-how" href="/directions/${p.id}">הוראות הגעה ←</a>` : ""}
          <div class="p-actions">
            <a class="dark" href="${waze}" target="_blank">ניווט ב-Waze</a>
            <a href="${gmaps}" target="_blank">Google Maps</a>
            ${p.instagram ? `<a href="${p.instagram}" target="_blank">Instagram</a>` : ""}
            <a class="plain" href="/edit/${p.id}">עריכה</a>
          </div>
        </div>`;
    }

    // ---------- סיכה: תמונה בעיגול (או אייקון) + תגית סוג ----------
    function markerIcon(p) {
      const visited = p.visited === "ביקרתי";
      const inside = p.image
        ? `<img src="/static/uploads/${p.image}" alt="">`
        : `<span class="pin-icon ${classOf(p)}">${iconOf(p)}</span>`;

      return L.divIcon({
        className: "",
        html: `
          <div class="pin ${classOf(p)} ${visited ? "" : "not-visited"}">
            <div class="pin-circle">${inside}</div>
            <div class="pin-label ${classOf(p)}">${iconOf(p)}${typeOf(p)}</div>
          </div>`,
        iconSize: [54, 54],
        iconAnchor: [27, 27],
        popupAnchor: [0, -30]
      });
    }

    // ---------- ציור הסיכות לפי כל הסינונים ----------
    function render() {
      markersLayer.clearLayers();

      // סינון לפי סוג ולפי ביקור
      let shown = places.filter(p =>
        (typeFilter === "הכול" || typeOf(p) === typeFilter) &&
        (visitedFilter === "הכול" || (visitedFilter === "ביקרתי") === (p.visited === "ביקרתי"))
      );

      // סינון לפי אזור: מוסיפים מרחק, משאירים רק מה שבתוך הרדיוס, וממיינים
      if (areaCenter) {
        shown = shown
          .map(p => ({ ...p, dist: distanceKm(areaCenter[0], areaCenter[1], p.lat, p.lng) }))
          .filter(p => p.dist <= areaRadius)
          .sort((a, b) => a.dist - b.dist);
      }

      const markerById = {};
      shown.forEach(p => {
        markerById[p.id] = L.marker([p.lat, p.lng], { icon: markerIcon(p) })
          .bindPopup(popupHtml(p), { minWidth: 290, maxWidth: 290 })
          .addTo(markersLayer);
      });

      document.getElementById("counter").textContent = `${shown.length} מקומות`;
      renderAreaList(shown, markerById);
    }

    // ---------- הרשימה בחלון "מה יש באזור" ----------
    function renderAreaList(shown, markerById) {
      const list = document.getElementById("area-list");
      const hint = document.getElementById("area-hint");
      list.innerHTML = "";
      if (!areaCenter) return;

      hint.textContent = shown.length
        ? `${shown.length} מקומות ברדיוס ${areaRadius} ק"מ`
        : `אין מקומות ברדיוס ${areaRadius} ק"מ. נסי רדיוס גדול יותר`;

      shown.forEach(p => {
        const li = document.createElement("li");
        li.innerHTML = `<span class="name ${classOf(p)}">${iconOf(p)} ${p.name}</span>
                        <span class="dist">${p.dist.toFixed(1)} ק"מ</span>`;
        li.addEventListener("click", () => {
          map.setView([p.lat, p.lng], 13);
          markerById[p.id].openPopup();
        });
        list.appendChild(li);
      });
    }

    // ---------- בחירת נקודה ----------
    function setAreaCenter(lat, lng) {
      areaCenter = [lat, lng];
      if (areaCircle) map.removeLayer(areaCircle);
      areaCircle = L.circle(areaCenter, {
        radius: areaRadius * 1000,      // Leaflet מודד במטרים
        color: "#111", weight: 1, fillColor: "#b9a6d9", fillOpacity: 0.08
      }).addTo(map);
      map.fitBounds(areaCircle.getBounds());
      render();
    }

    function openArea() {
      areaOpen = true;
      document.getElementById("area-panel").hidden = false;
      document.getElementById("area-hint").textContent = "לחצי על המפה בנקודה שמעניינת אותך";
      document.getElementById("area-btn").classList.add("on");
      map.getContainer().classList.add("picking");
    }

    function closeArea() {
      areaOpen = false;
      areaCenter = null;
      if (areaCircle) { map.removeLayer(areaCircle); areaCircle = null; }
      document.getElementById("area-panel").hidden = true;
      document.getElementById("area-btn").classList.remove("on");
      map.getContainer().classList.remove("picking");
      render();
    }

    document.getElementById("area-btn").addEventListener("click", () => areaOpen ? closeArea() : openArea());
    document.getElementById("area-close").addEventListener("click", closeArea);

    // לחיצה על המפה כשהחלון פתוח = בחירת נקודה
    map.on("click", e => {
      if (areaOpen) setAreaCenter(e.latlng.lat, e.latlng.lng);
    });

    // שינוי רדיוס
    document.getElementById("area-radius").addEventListener("change", e => {
      areaRadius = Number(e.target.value);
      if (areaCenter) setAreaCenter(areaCenter[0], areaCenter[1]);
    });

    // המיקום שלי (GPS)
    document.getElementById("my-location").addEventListener("click", () => {
      const hint = document.getElementById("area-hint");
      hint.textContent = "מאתרת את המיקום שלך...";
      navigator.geolocation.getCurrentPosition(
        pos => setAreaCenter(pos.coords.latitude, pos.coords.longitude),
        ()  => hint.textContent = "לא הצלחתי לקבל מיקום. אפשר ללחוץ על המפה במקום."
      );
    });

    // ---------- כפתורי הסינון ----------
    function makeFilters(containerId, options, onSelect) {
      const container = document.getElementById(containerId);
      options.forEach(([value, label], i) => {
        const btn = document.createElement("button");
        btn.className = i === 0 ? "f on" : "f";
        btn.textContent = label;
        btn.addEventListener("click", () => {
          container.querySelectorAll(".f").forEach(b => b.classList.remove("on"));
          btn.classList.add("on");
          onSelect(value);
          render();
        });
        container.appendChild(btn);
      });
    }

    makeFilters("type-filters", TYPE_OPTIONS, value => typeFilter = value);
    makeFilters("visited-filters", VISITED_OPTIONS, value => visitedFilter = value);
    render();
  </script>
</body>
</html>
